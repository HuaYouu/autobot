<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minecraft Bot Control</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using a common icon library for status indicators -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="column-left">
            <h2><i class="fa-solid fa-robot"></i> Danh Sách Bot Đã Lưu</h2>
            <div id="bot-list">
                <!-- Example Bot Item (will be generated dynamically) -->
                <div class="bot-item selected" data-bot-name="Bot-CongViec-1">
                    <span class="status-icon running"><i class="fa-solid fa-check"></i></span>
                    <span class="bot-name">Bot-CongViec-1</span>
                    <span class="status-label running">Đang Chạy</span>
                </div>
                <div class="bot-item" data-bot-name="Bot-TimKiem-2">
                    <span class="status-icon waiting"><i class="fa-solid fa-clock"></i></span>
                    <span class="bot-name">Bot-TimKiem-2</span>
                    <span class="status-label waiting">Chờ Lệnh</span>
                </div>
                <div class="bot-item" data-bot-name="Bot-KhaiKhoang-3">
                    <span class="status-icon disconnected"><i class="fa-solid fa-xmark"></i></span>
                    <span class="bot-name">Bot-KhaiKhoang-3</span>
                    <span class="status-label disconnected">Ngắt Kết Nối</span>
                </div>
            </div>
            <div class="bot-actions">
                <button id="add-bot-btn"><i class="fa-solid fa-plus"></i> Thêm Bot</button>
                <button id="delete-bot-btn"><i class="fa-solid fa-trash"></i> Xóa Bot</button>
            </div>
        </div>
        <div class="column-right">
            <div class="controls-container">
                <h2><i class="fa-solid fa-sliders"></i> Điều Khiển Trạng Thái Bot: <span id="selected-bot-name">Chọn Bot...</span></h2>
                <div id="module-controls">
                    <!-- Example Module Controls (will be generated dynamically) -->
                    <div class="module-control">
                        <span><i class="fa-solid fa-plug-circle-check"></i> Tự Động Kết Nối Lại</span>
                        <label class="switch"><input type="checkbox" checked><span class="slider round"></span></label>
                    </div>
                    <div class="module-control">
                        <span><i class="fa-solid fa-eye"></i> Chế Độ Theo Dõi</span>
                        <label class="switch"><input type="checkbox"><span class="slider round"></span></label>
                    </div>
                    <div class="module-control">
                        <span><i class="fa-solid fa-shield-halved"></i> Chế Độ Chiến Đấu</span>
                        <label class="switch"><input type="checkbox"><span class="slider round"></span></label>
                    </div>
                     <button id="home-base-btn"><i class="fa-solid fa-house"></i> Gửi Bot Về Home Base</button>
                </div>
            </div>
            <div class="cli-container">
                <h2><i class="fa-solid fa-terminal"></i> Command Line Interface (CLI)</h2>
                <div id="cli-output"><p>[System] Vui lòng chọn bot để bắt đầu tương tác.</p></div>
                <div class="cli-input-wrapper">
                    <input type="text" id="cli-input-field" placeholder="Nhập lệnh (ví dụ: move 10 5 20, chat Hello world)...">
                    <button id="cli-send-btn">Gửi</button>
                </div>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
